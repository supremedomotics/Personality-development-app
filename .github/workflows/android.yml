name: android-build

on:
  push:
    branches: [claude/exciting-curie-97xzfn, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Test + build CEO Forge (text-only prototype)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib test
      - run: flutter test
      - name: Build release APK (debug-signed, sideload only)
        run: flutter build apk --release
      - name: Verify merged release manifest (permissions + backup)
        run: |
          set -e
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y aapt >/dev/null
          APK=build/app/outputs/flutter-apk/app-release.apk
          # No permissions are expected for the offline prototype. If you intentionally add one, list it here.
          tools/check_manifest.sh "$APK" | tee permissions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ceo-forge-text-prototype-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            permissions.txt

  bench:
    name: Build on-device AI benchmark APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/bench_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib test
      - run: flutter test
      - name: Build profile APK (no R8 minification)
        run: flutter build apk --profile
      - uses: actions/upload-artifact@v4
        with:
          name: ceo-forge-bench-apk
          path: tools/bench_app/build/app/outputs/flutter-apk/app-profile.apk
